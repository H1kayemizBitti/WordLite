name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    # 只改文档不跑，省 macOS 构建额度（标签推送不受 paths 过滤影响）
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: 安装依赖并构建前端
        run: |
          npm ci
          npm run build
      - name: 打包 NSIS
        run: npx tauri build --bundles nsis
      - name: 自测
        # 用 cmd 直接重定向：PowerShell 管道会把 stdout 转成 UTF-16 并改写退出码
        # 跑三次：默认长文档 / 纯中文长文档样本 / 中英数字混排样本
        shell: cmd
        env:
          # 自测 PDF 落盘到 std::env::temp_dir()：Windows 读 TEMP/TMP，统一指向 runner.temp，
          # 下面的 PDF 上传路径才对得上；TMPDIR 兼容显式读取该变量的实现。
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          src-tauri\target\release\wordlite.exe --selftest --long-print > selftest-windows.log 2>&1
          if errorlevel 1 exit /b %errorlevel%
          src-tauri\target\release\wordlite.exe --selftest --long-print-file "${{ github.workspace }}/tools/fixtures/long-cjk.txt" > selftest-windows-cjk.log 2>&1
          if errorlevel 1 exit /b %errorlevel%
          src-tauri\target\release\wordlite.exe --selftest --long-print-file "${{ github.workspace }}/tools/fixtures/long-mixed.txt" > selftest-windows-mixed.log 2>&1
          if errorlevel 1 exit /b %errorlevel%
      - name: 校验自测结果
        # 三份日志逐个校验；REQUIRE_PDF=1 时 checker 会要求 longPdfPages === previewPages
        shell: cmd
        env:
          REQUIRE_PDF: '1'
        run: |
          node tools/ci-selftest.mjs selftest-windows.log
          if errorlevel 1 exit /b %errorlevel%
          node tools/ci-selftest.mjs selftest-windows-cjk.log
          if errorlevel 1 exit /b %errorlevel%
          node tools/ci-selftest.mjs selftest-windows-mixed.log
          if errorlevel 1 exit /b %errorlevel%
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: 上传自测输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-selftest
          path: |
            selftest-windows.log
            selftest-windows-cjk.log
            selftest-windows-mixed.log
          if-no-files-found: warn
      - name: 上传 PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pdf
          path: ${{ runner.temp }}/wordlite-selftest-*.pdf
          if-no-files-found: warn

  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 添加 Intel 目标
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: 安装依赖并构建前端
        run: |
          npm ci
          npm run build
      - name: 打包 Universal app 和 dmg
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: 自测
        shell: bash
        # macOS 的 std::env::temp_dir() 是 $TMPDIR；指向 runner.temp，下面的上传路径才对得上
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          # 三次自测任何一次失败都让 job 直接变红（tee 会把退出码吞掉，靠 pipefail + -e 兜住）
          set -eo pipefail
          app='src-tauri/target/universal-apple-darwin/release/bundle/macos/WordLite.app'
          "$app/Contents/MacOS/wordlite" --selftest --long-print 2>&1 | tee selftest-macos.log
          "$app/Contents/MacOS/wordlite" --selftest --long-print-file "$GITHUB_WORKSPACE/tools/fixtures/long-cjk.txt" 2>&1 | tee selftest-macos-cjk.log
          "$app/Contents/MacOS/wordlite" --selftest --long-print-file "$GITHUB_WORKSPACE/tools/fixtures/long-mixed.txt" 2>&1 | tee selftest-macos-mixed.log
      - name: 校验自测结果
        env:
          REQUIRE_PDF: '1'
        run: |
          node tools/ci-selftest.mjs selftest-macos.log
          node tools/ci-selftest.mjs selftest-macos-cjk.log
          node tools/ci-selftest.mjs selftest-macos-mixed.log
      - name: 上传 dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: 上传自测输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-selftest
          path: |
            selftest-macos.log
            selftest-macos-cjk.log
            selftest-macos-mixed.log
          if-no-files-found: warn
      - name: 上传 PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-pdf
          path: ${{ runner.temp }}/wordlite-selftest-*.pdf
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 统一附件命名
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp dist/windows-nsis/*.exe "release-assets/WordLite_${version}_x64-setup.exe"
          cp dist/macos-dmg/*.dmg "release-assets/WordLite_${version}_universal.dmg"
          ls -l release-assets
      - name: 建草稿 Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          files: release-assets/*
